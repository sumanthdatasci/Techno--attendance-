name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease

    - name: Upload Debug APK to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Create Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0-${{ github.run_number }}
        release_name: Techno Attendance App v1.0 Build ${{ github.run_number }}
        body: |
          🎉 Techno Attendance Management System
          
          Build Information:
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          
          Features:
          ✅ Member Management
          ✅ Attendance Tracking
          ✅ Monthly Reports
          ✅ Holiday Management
          ✅ Backup & Restore
          
          Installation: Download APK, enable Unknown sources, and install.
        draft: false
        prerelease: false

    - name: Upload Debug APK to Release
      if: success()
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/debug/app-debug.apk
        asset_name: Techno-Attendance-debug-${{ github.run_number }}.apk
        asset_content_type: application/vnd.android.package-archive

    - name: Upload Release APK to Release
      if: success()
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/release/app-release-unsigned.apk
        asset_name: Techno-Attendance-release-${{ github.run_number }}.apk
        asset_content_type: application/vnd.android.package-archive
